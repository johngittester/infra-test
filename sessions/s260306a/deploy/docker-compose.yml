version: '3.8'

x-common-env: &common-env
  SECRET_KEY: 2d4d0b43be16a4b114836eeccc8812cffa4a69bba6dcd4ca07eabc2a3cda90b9f2108631b23887fe
  DATABASE_URL: postgresql://cmx_app:2d4d0b43Db!@db:5432/cmx_crm_prod
  REDIS_URL: redis://:f2108631b2@redis:6379/0
  AWS_ACCESS_KEY_ID: AKIA58A436A37F56D0D7
  AWS_SECRET_ACCESS_KEY: UlJcpSeI4PKAzIIHeNDlNkoKg5AHW6lNPj3f9ebY
  AWS_DEFAULT_REGION: eu-west-1
  SENTRY_DSN: https://14836eeccc8812cffa4a69bba6dcd4ca@o6863942.ingest.sentry.io/3256888

services:
  web:
    image: registry.contmontx.com/cmx-crm:latest
    restart: unless-stopped
    environment:
      <<: *common-env
      DJANGO_SETTINGS_MODULE: cmx.settings.production
      STRIPE_SECRET_KEY: sk_live_87fe3be567e69619d541fe210f6f78aa5e
      SENDGRID_API_KEY: SG.2d4d0b43be16a4b114836e.eccc8812cffa4a69bba6dcd4ca07
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: registry.contmontx.com/cmx-crm:latest
    command: celery -A cmx worker -l info
    restart: unless-stopped
    environment:
      <<: *common-env

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cmx_crm_prod
      POSTGRES_USER: cmx_app
      POSTGRES_PASSWORD: 2d4d0b43Db!
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmx_app -d cmx_crm_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass f2108631b2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

volumes:
  pgdata:
